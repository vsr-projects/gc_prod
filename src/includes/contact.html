<section id="contact" class="panel contact-section">
  <div class="container">
    <h2>Get in Touch</h2>
    <div class="row g-4 align-items-center">
      <div class="col-md-8">
        <form>
          <input type="text" class="form-control custom-input" placeholder="Full Name*" required>
          <input type="text" class="form-control custom-input" placeholder="Company Name*" required>
          <div class="d-flex flex-wrap gap-2">
            <input type="email" class="form-control custom-input flex-grow-1" placeholder="Email*" required>
            <input type="text" class="form-control custom-input flex-grow-1" placeholder="Mobile*" required>
          </div>
          <textarea class="form-control custom-input" rows="4" placeholder="Query*" required></textarea>
          <button type="submit" class="btn-submit btn">Submit</button>
        </form>
      </div>
      <div class="col-md-4 text-center">
        <img src="assets/get_in_touch.png" alt="Get in Touch" class="img-fluid">
      </div>
    </div>
  </div>
</section>
