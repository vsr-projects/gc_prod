<section id="contact-form" class="cmp-contact-form">
    <h2 class="cmp-contact-form__heading">Get In Touch</h2>
    <form class="cmp-contact-form__form" novalidate>
      <div class="cmp-contact-form__row">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />
      </div>
      <div class="cmp-contact-form__row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="cmp-contact-form__row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="cmp-contact-form__btn">Send Message</button>
    </form>
  </section>
